name: Feature request
description: Suggest a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: I'm trying to … but DevFlow currently …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would the ideal solution look like?
      description: A user-facing description first; implementation details only if you've thought about them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
